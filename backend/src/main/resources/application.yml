spring:
  application:
    name: taskmanager
  datasource:
    # Default: in-memory H2 in PostgreSQL compatibility mode, so the app runs with zero setup.
    # Activate the "postgres" profile to use a real PostgreSQL database.
    url: jdbc:h2:mem:taskmanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    login-attempts:
      # After this many wrong passwords for one email from one IP, that pair must wait out the window.
      max-per-account-and-ip: 5
      # After this many failures from one IP (any emails), the IP must wait out the window.
      max-per-ip: 20
      window: 15m
